version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: changeuser
      POSTGRES_PASSWORD: changepass
      POSTGRES_DB: change_dbname_1
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:alpine
    restart: always
    ports:
      - '6379:6379'

  ollama:
    image: ollama/ollama:latest
    restart: always
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama

  langfuse:
    image: langfuse/langfuse:2
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - '3080:3000'
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=http://localhost:3080
      - NEXTAUTH_SECRET=langfuse_nextauth_secret_change_me
      - SALT=langfuse_salt_change_me
      - DATABASE_URL=postgresql://changeuser:changepass@postgres:5432/langfuse_data
      - TELEMETRY_ENABLED=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    ports:
      - '5000:5000'
    depends_on:
      - postgres
      - redis
      - ollama
      - langfuse
    environment:
      NODE_ENV: development
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USERNAME: changeuser
      PG_PASSWORD: changepass
      # --- CONTINUES: Uses the main app database ---
      PG_DATABASE: change_dbname_1
      # ---------------------------------------------
      REDIS_HOST: redis
      REDIS_PORT: 6379
      HTTP_PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-supersecret}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS}
      CLIENT_BASE_URL: http://localhost:3000
      SERVER_BASE_URL: http://localhost:5000
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      NOTES_DIR: ${NOTES_DIR:-/app/mkdn_files}
      VECTOR_TABLE_NAME: ${VECTOR_TABLE_NAME:-document_chunk}
      VECTOR_DISTANCE_STRATEGY: ${VECTOR_DISTANCE_STRATEGY:-cosine}

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SERVER_BASE_URL: http://localhost:5000
    restart: always
    ports:
      - '3000:3000'
    depends_on:
      - server
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SERVER_BASE_URL: http://localhost:5000

volumes:
  postgres_data:
  ollama_data:
